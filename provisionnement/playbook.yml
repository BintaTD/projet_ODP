---
# provision.yml
# Provisionnement complet de l'hôte pentest (VM Kali)

- hosts: pentest_host
  become: true

  vars_files:
    - vars/main.yml

  tasks:
    - name: Mettre à jour le cache apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Installer les outils de pentesting (Kali)
      apt:
        name:
          - kali-linux-large
          - crowbar
        state: present
      register: kali_install
      retries: 3
      delay: 10
      until: kali_install is succeeded

    - name: Installer Burp Suite et OpenVPN
      apt:
        name:
          - burpsuite
          - openvpn
        state: present

    - name: Installer les dépendances pour le dépôt Docker
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Créer le dossier pour la clé GPG Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ajouter la clé GPG officielle de Docker
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Ajouter le dépôt Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable"
        state: present
        filename: docker

    - name: Installer Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes
    
    - name: Ajouter l'utilisateur vagrant au groupe docker
      user:
        name: vagrant
        groups: docker
        append: yes

    - name: Démarrer et activer OpenVPN
      service:
        name: openvpn
        state: started
        enabled: yes

    - name: Installer python3-full (pour venv)
      apt:
        name: python3-full
        state: present

    - name: Créer un venv pour les modules Python nécessaires à Ansible
      command: python3 -m venv /opt/ansible-venv
      args:
        creates: /opt/ansible-venv

    - name: Installer le module docker dans le venv
      pip:
        name: docker
        virtualenv: /opt/ansible-venv