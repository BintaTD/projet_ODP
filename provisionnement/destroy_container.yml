---
# destroy_container.yml
# Détruit le conteneur pentest d'un utilisateur donné.
# Usage : ansible-playbook destroy_container.yml -e "user_id=alice"

- hosts: pentest_host
  become: true
  vars:
    ansible_python_interpreter: /opt/ansible-venv/bin/python3
  vars_files:
    - vars/main.yml

  tasks:
    - name: Vérifier qu'un user_id a été fourni
      fail:
        msg: "Il faut passer -e 'user_id=<nom>'"
      when: user_id is not defined

    - name: Détruire le conteneur pentest de l'utilisateur
      community.docker.docker_container:
        name: "pentest-{{ user_id }}"
        state: absent
      register: destroy_result

    - name: Afficher le résultat
      debug:
        msg: "Conteneur pentest-{{ user_id }} supprimé."